<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Espelho Meu - Agendamento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
        }
        .container {
            max-width: 1140px;
            margin: 0 auto;
        }
        .hero-section {
            background-color: #ffffff;
            padding: 3rem 2rem;
            border-radius: 12px;
            margin-bottom: 2rem;
            border: 1px solid #dee2e6;
        }
        .card {
            transition: transform 0.2s;
        }
        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 .5rem 1rem rgba(0,0,0,.15)!important;
        }
    </style>
</head>
<body>


<nav class="navbar navbar-expand navbar-dark bg-dark py-3">
    <div class="container d-flex justify-content-between align-items-center">
        <a class="navbar-brand fw-bold fs-4" href="index.html">🪞 Espelho Meu</a>
        <div class="d-flex">
            <a href="agenda.html" class="btn btn-outline-light me-3 px-4">Minha Agenda</a>
            <a href="login.html" class="btn btn-light fw-bold px-4">👤 Sair</a>
        </div>
    </div>
</nav>

<div class="container mt-5">
    
    <div class="hero-section text-center shadow-sm">
        <h1 class="fw-bolder mb-2">✨ Escolha seu Profissional e Agende ✨</h1>
        <p class="text-muted">Selecione o serviço desejado, a data e o horário diretamente no card do profissional.</p>
    </div>

   
    <div class="row" id="container-profissionais">
        
    </div>
</div>

<footer class="bg-white border-top py-4 mt-5 text-center text-muted">
    <div class="container">
        <small>© 2026 Espelho Meu - Sistema de Agendamento. Projeto GPMS.</small>
    </div>
</footer>

<script>
    let listaServicos = [];

    window.addEventListener('DOMContentLoaded', async () => {
        await carregarServicosECapinar();
    });

    async function carregarServicosECapinar() {
        try {
            
            const resServ = await fetch('http://localhost:5000/servicos');
            if (resServ.ok) {
                listaServicos = await resServ.json();
            }
            await carregarProfissionais();
        } catch (erro) {
            console.error('Erro ao carregar dados iniciais:', erro);
        }
    }

    async function carregarProfissionais() {
        try {
            const resposta = await fetch('http://localhost:5000/profissionais');
            if (resposta.ok) {
                const profissionais = await resposta.json();
                const container = document.getElementById('container-profissionais');
                container.innerHTML = '';

                profissionais.forEach(prof => {
                    
                    let optionsServicos = '<option selected disabled value="">Selecione o serviço...</option>';
                    listaServicos.forEach(serv => {
                        optionsServicos += `<option value="${serv.id}">${serv.nome} - R$ ${serv.preco}</option>`;
                    });

                    const cardHTML = `
                        <div class="col-md-6 mb-4">
                            <div class="card h-100 shadow-sm border-0">
                                <div class="card-body p-4">
                                    <h3 class="card-title fw-bold text-dark">${prof.nome}</h3>
                                    <h6 class="card-subtitle mb-3 text-primary fw-semibold">${prof.especialidade}</h6>
                                    <p class="text-muted small mb-4">📞 ${prof.tel}</p>

                                    <!-- Seleção de Serviço por Profissional -->
                                    <div class="mb-3">
                                        <label class="form-label fw-bold small">Serviço:</label>
                                        <select class="form-select select-servico" data-prof-id="${prof.id}">
                                            ${optionsServicos}
                                        </select>
                                    </div>

                                    <!-- Seleção de Data -->
                                    <div class="mb-3">
                                        <label class="form-label fw-bold small">Data:</label>
                                        <input type="date" class="form-control input-data">
                                    </div>

                                    <!-- Seleção de Horário -->
                                    <div class="mb-3">
                                        <label class="form-label fw-bold small">Horário:</label>
                                        <div class="d-flex flex-wrap gap-2">
                                            <button type="button" class="btn btn-outline-primary btn-sm time-btn">10:00</button>
                                            <button type="button" class="btn btn-outline-primary btn-sm time-btn">14:00</button>
                                            <button type="button" class="btn btn-outline-primary btn-sm time-btn">16:00</button>
                                        </div>
                                    </div>
                                </div>
                                <div class="card-footer bg-white border-top-0 p-4 pt-0">
                                    <button class="btn btn-success w-100 fw-bold py-2 btn-agendar" data-profissional="${prof.id}">Confirmar Agendamento</button>
                                </div>
                            </div>
                        </div>
                    `;
                    container.innerHTML += cardHTML;
                });

                ativarEventosCards();
            }
        } catch (erro) {
            console.error('Erro ao carregar profissionais:', erro);
        }
    }

    function ativarEventosCards() {
        
        document.querySelectorAll('.card').forEach(card => {
            const timeButtons = card.querySelectorAll('.time-btn');
            timeButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    timeButtons.forEach(b => {
                        b.classList.remove('btn-primary', 'active');
                        b.classList.add('btn-outline-primary');
                    });
                    btn.classList.remove('btn-outline-primary');
                    btn.classList.add('btn-primary', 'active');
                });
            });
        });


        document.querySelectorAll('.btn-agendar').forEach(botao => {
            botao.addEventListener('click', async function() {
                const cliente_id = localStorage.getItem('cliente_id');
                if (!cliente_id) {
                    alert('Por favor, faça login para agendar.');
                    window.location.href = 'login.html';
                    return;
                }

                const card = this.closest('.card');
                const servico_id = card.querySelector('.select-servico').value;
                const data_agendamento = card.querySelector('.input-data').value;
                const profissional_id = this.getAttribute('data-profissional');
                const horarioSelecionado = card.querySelector('.time-btn.active');

                if (!servico_id) return alert('Selecione um serviço.');
                if (!data_agendamento) return alert('Escolha uma data.');
                if (!horarioSelecionado) return alert('Selecione um horário.');

                const hora = horarioSelecionado.innerText;
                const dataHoraIso = `${data_agendamento}T${hora}:00`;

                const dadosAgendamento = {
                    cliente_id: parseInt(cliente_id),
                    profissional_id: parseInt(profissional_id),
                    servico_id: parseInt(servico_id),
                    dataHora: dataHoraIso
                };

                try {
                    const resposta = await fetch('http://localhost:5000/agendamentos', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(dadosAgendamento)
                    });

                    const retorno = await resposta.json();

                    if (resposta.ok) {
                        alert('Agendamento realizado com sucesso!');
                        localStorage.setItem('ultimo_agendamento_id', retorno.id);
                        window.location.href = 'confirmacao.html';
                    } else {
                        alert('Erro: ' + (retorno.erro || 'Conflito de horário.'));
                    }
                } catch (erro) {
                    alert('Erro de conexão com o servidor.');
                }
            });
        });
    }
</script>

</body>
</html>
