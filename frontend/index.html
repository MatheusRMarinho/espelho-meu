<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Espelho Meu - Agendamento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
        }
        .container {
            max-width: 1140px;
            margin: 0 auto;
        }
        .hero-section {
            background-color: #ffffff;
            padding: 3rem 2rem;
            border-radius: 12px;
            margin-bottom: 2.5rem;
            border: 1px solid #dee2e6;
        }
        .time-btn {
            width: 95px;
        }
        .card {
            transition: transform 0.2s;
        }
        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 .5rem 1rem rgba(0,0,0,.15)!important;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand navbar-dark bg-dark py-3">
    <div class="container d-flex justify-content-between align-items-center">
        <a class="navbar-brand fw-bold fs-4" href="index.html">🪞 Espelho Meu</a>
        <div class="d-flex">
            <a href="admin.html" id="btn-nav-admin" class="btn btn-warning fw-bold me-3 px-4 d-none">⚙️ Painel Admin</a>
            <a href="agenda.html" class="btn btn-outline-light me-3 px-4">Minha Agenda</a>
            <a href="login.html" class="btn btn-light fw-bold px-4">👤 Entrar / Sair</a>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <div class="hero-section text-center shadow-sm">
        <h1 class="fw-bolder mb-2">✨ Bem-vinda(o) ao seu momento de cuidado ✨</h1>
        <p class="lead text-muted m-0">Escolha o profissional abaixo, selecione o serviço, a data e o horário desejado.</p>
    </div>

    <div class="d-flex justify-content-between align-items-end mb-4">
        <h3 class="fw-bold m-0">Profissionais Disponíveis</h3>
    </div>

    <div class="row" id="container-profissionais"></div>
</div>

<footer class="bg-white border-top py-4 mt-5 text-center text-muted">
    <div class="container">
        <small>© 2026 Espelho Meu - Sistema de Agendamento. Projeto GPMS.</small>
    </div>
</footer>

<script>
    let listaServicos = [];

    function mesmaEspecialidade(a, b) {
        return (a || '').trim().toLowerCase() === (b || '').trim().toLowerCase();
    }

    window.addEventListener('DOMContentLoaded', async () => {
        if (localStorage.getItem('is_admin') === 'true') {
            document.getElementById('btn-nav-admin').classList.remove('d-none');
        }
        await inicializarPagina();
    });

    async function inicializarPagina() {
        try {
            const resServicos = await fetch('http://localhost:5000/servicos');
            if (resServicos.ok) {
                listaServicos = await resServicos.json();
            }
            await carregarProfissionais();
        } catch (erro) {
            console.error('Erro ao conectar com o servidor:', erro);
        }
    }

    async function carregarProfissionais() {
        const resProf = await fetch('http://localhost:5000/profissionais');
        if (!resProf.ok) return;

        // Só aparecem no catálogo os profissionais com horários de atendimento cadastrados
        const profissionais = (await resProf.json()).filter(p => p.horarios && p.horarios.length > 0);
        const container = document.getElementById('container-profissionais');
        container.innerHTML = '';

        if (profissionais.length === 0) {
            container.innerHTML = '<p class="text-muted">Nenhum profissional com horários disponíveis no momento.</p>';
            return;
        }

        profissionais.forEach(prof => {
            // Mostra só os serviços da especialidade do profissional
            const servicosDoProf = listaServicos.filter(s => mesmaEspecialidade(s.especialidade, prof.especialidade));
            let opcoesServico = servicosDoProf.length
                ? '<option selected disabled value="">Qual serviço você procura?</option>'
                : '<option selected disabled value="">Nenhum serviço disponível</option>';
            servicosDoProf.forEach(s => {
                opcoesServico += `<option value="${s.id}">${s.nome} - R$ ${Number(s.preco).toFixed(2)}</option>`;
            });

            // Cada profissional tem os próprios horários de atendimento
            const botoesHtml = prof.horarios.map(h => 
                `<button type="button" class="btn btn-outline-primary btn-sm time-btn" data-hora="${h}">${h}</button>`
            ).join('');

            container.innerHTML += `
                <div class="col-md-6 col-lg-4 mb-4">
                    <div class="card h-100 shadow-sm border-0" data-prof-id="${prof.id}">
                        <div class="card-body p-4">
                            <h4 class="card-title fw-bold">${prof.nome}</h4>
                            <h6 class="card-subtitle mb-2 text-primary fw-semibold">Especialidade: ${prof.especialidade}</h6>
                            <p class="text-muted small mb-3">📞 ${prof.tel}</p>
                            
                            <div class="mb-3">
                                <label class="form-label fw-bold small text-dark">1. Escolha o serviço:</label>
                                <select class="form-select select-servico">
                                    ${opcoesServico}
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold small text-dark">2. Escolha a data:</label>
                                <input type="date" class="form-control input-data">
                            </div>

                            <div class="mb-2">
                                <label class="form-label fw-bold small text-dark">3. Escolha o horário:</label>
                                <div class="d-flex flex-wrap gap-2 time-container">
                                    ${botoesHtml}
                                </div>
                            </div>
                        </div>
                        <div class="card-footer bg-white border-top-0 p-4 pt-0">
                            <button class="btn btn-success w-100 fw-bold py-2 btn-agendar" data-profissional="${prof.id}">
                                Confirmar Agendamento
                            </button>
                        </div>
                    </div>
                </div>
            `;
        });

        configurarInteracoesCard();
    }

    function configurarInteracoesCard() {
        const hoje = new Date().toISOString().split('T')[0];

        document.querySelectorAll('.card').forEach(card => {
            const profId = card.getAttribute('data-prof-id');
            const inputData = card.querySelector('.input-data');
            const botoesHorario = card.querySelectorAll('.time-btn');

            inputData.value = hoje;
            inputData.min = hoje;

            async function atualizarHorariosDisponiveis() {
                const dataEscolhida = inputData.value;
                if (!dataEscolhida) return;

                try {
                    const res = await fetch(`http://localhost:5000/agenda?data=${dataEscolhida}&profissional_id=${profId}`);
                    const agendamentosDia = res.ok ? await res.json() : [];

                    const ativos = agendamentosDia.filter(a => 
                        a.status !== 'Cancelado' && a.profissional.id == profId
                    );

                    botoesHorario.forEach(btn => {
                        const horaBtn = btn.getAttribute('data-hora');
                        const [hBtn, mBtn] = horaBtn.split(':').map(Number);
                        const minutosBtn = hBtn * 60 + mBtn;

                        const estaOcupado = ativos.some(ag => {
                            const horaInicioStr = ag.dataHora.substring(11, 16);
                            const [hIni, mIni] = horaInicioStr.split(':').map(Number);
                            const inicioMin = hIni * 60 + mIni;
                            const fimMin = inicioMin + (ag.servico.duracaoEmMinutos || 60);

                            return minutosBtn >= inicioMin && minutosBtn < fimMin;
                        });

                        btn.classList.remove('btn-primary', 'active', 'btn-secondary', 'btn-outline-primary');

                        if (estaOcupado) {
                            btn.disabled = true;
                            btn.classList.add('btn-secondary');
                            btn.innerText = `${horaBtn} (Ocupado)`;
                        } else {
                            btn.disabled = false;
                            btn.classList.add('btn-outline-primary');
                            btn.innerText = horaBtn;
                        }
                    });
                } catch (e) {
                    console.error('Erro ao checar horários ocupados:', e);
                }
            }

            atualizarHorariosDisponiveis();
            inputData.addEventListener('change', atualizarHorariosDisponiveis);

            botoesHorario.forEach(btn => {
                btn.addEventListener('click', () => {
                    if (btn.disabled) return;
                    botoesHorario.forEach(b => {
                        if (!b.disabled) {
                            b.classList.remove('btn-primary', 'active');
                            b.classList.add('btn-outline-primary');
                        }
                    });
                    btn.classList.remove('btn-outline-primary');
                    btn.classList.add('btn-primary', 'active');
                });
            });
        });

        document.querySelectorAll('.btn-agendar').forEach(botao => {
            botao.addEventListener('click', async function() {
                const cliente_id = localStorage.getItem('cliente_id');
                if (!cliente_id) {
                    alert('Por favor, faça login para agendar.');
                    window.location.href = 'login.html';
                    return;
                }

                const card = this.closest('.card');
                const servico_id = card.querySelector('.select-servico').value;
                const data = card.querySelector('.input-data').value;
                const btnHorario = card.querySelector('.time-btn.active');
                const profissional_id = this.getAttribute('data-profissional');

                if (!servico_id) return alert('Selecione um serviço neste card.');
                if (!data) return alert('Escolha uma data neste card.');
                if (!btnHorario || btnHorario.disabled) return alert('Selecione um horário disponível neste card.');

                const horaLimpa = btnHorario.getAttribute('data-hora');

                const payload = {
                    cliente_id: parseInt(cliente_id),
                    profissional_id: parseInt(profissional_id),
                    servico_id: parseInt(servico_id),
                    dataHora: `${data}T${horaLimpa}:00`
                };

                try {
                    const resposta = await fetch('http://localhost:5000/agendamentos', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    const retorno = await resposta.json();
                    if (resposta.ok) {
                        localStorage.setItem('ultimo_agendamento_id', retorno.id);
                        window.location.href = 'confirmacao.html';
                    } else {
                        alert('Não foi possível agendar: ' + (retorno.erro || 'Horário indisponível.'));
                    }
                } catch (e) {
                    alert('Erro de conexão com o servidor.');
                }
            });
        });
    }
</script>
</body>
</html>
