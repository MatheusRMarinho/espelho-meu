<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Espelho Meu - Entrar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-width: 1200px; 
            background-color: #f4f6f9;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .login-container {
            width: 1140px;
            margin: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
        }
        .login-card {
            background-color: #ffffff;
            padding: 3rem;
            border-radius: 12px;
            border: 1px solid #dee2e6;
            width: 100%;
            max-width: 450px;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand navbar-dark bg-dark py-3">
    <div class="container d-flex justify-content-between align-items-center" style="width: 1140px;">
        <a class="navbar-brand fw-bold fs-4">🪞 Espelho Meu</a>
        
    </div>
</nav>

<div class="login-container">
    <div class="login-card shadow-sm">
        <div class="text-center mb-4">
            <h2 class="fw-bold">Bem-vindo(a) de volta!</h2>
            <p class="text-muted">Faça login para gerenciar seus agendamentos.</p>
        </div>
        
        <form id="form-login">
            <div class="mb-3">
                <label class="form-label fw-bold">E-mail</label>
                <input type="email" id="email" class="form-control form-control-lg border-primary" placeholder="seu@email.com" required>
            </div>
            <div class="mb-4">
                <label class="form-label fw-bold">Senha</label>
                <input type="password" id="senha" class="form-control form-control-lg border-primary" placeholder="••••••••" required>
            </div>
            
            <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold mb-3">Entrar</button>
            
            <div class="text-center mt-3">
    <a href="#" class="text-decoration-none text-muted d-block mb-2">Esqueci minha senha</a>
    <span class="text-muted">Ainda não tem uma conta? </span>
    <a href="cadastro-clientes.html" class="text-decoration-none fw-bold text-primary">Cadastre-se</a>
</div>
        </form>
    </div>
</div>

<script>
    document.getElementById('form-login').addEventListener('submit', async function(evento) {
        evento.preventDefault(); 
        
        const dadosLogin = {
            email: document.getElementById('email').value,
            senha: document.getElementById('senha').value
        };

        try {
            const resposta = await fetch('http://localhost:5000/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dadosLogin)
            });

            if (resposta.ok) {
                alert('Login aprovado!');
                window.location.href = 'index.html'; 
            } else {
                alert('E-mail ou senha incorretos. Tente novamente.');
            }
        } catch (erro) {
            alert('Erro de conexão. A API está rodando?');
        }
    });
</script>

</body>
</html>
