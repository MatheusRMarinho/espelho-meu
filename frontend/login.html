<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Espelho Meu - Entrar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-width: 1200px; 
            background-color: #f4f6f9;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .login-container {
            width: 1140px;
            margin: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
        }
        .login-card {
            background-color: #ffffff;
            padding: 3rem;
            border-radius: 12px;
            border: 1px solid #dee2e6;
            width: 100%;
            max-width: 450px;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand navbar-dark bg-dark py-3">
    <div class="container d-flex justify-content-between align-items-center" style="width: 1140px;">
        <a class="navbar-brand fw-bold fs-4" href="index.html">🪞 Espelho Meu</a>
        <div class="d-flex">
            <a href="index.html" class="btn btn-outline-light px-4">Voltar ao Início</a>
        </div>
    </div>
</nav>

<div class="login-container">
    <div class="login-card shadow-sm">
        <div class="text-center mb-4">
            <h2 class="fw-bold">Bem-vindo(a) de volta!</h2>
            <p class="text-muted">Faça login para gerenciar seus agendamentos.</p>
        </div>
        
        <form>
            <div class="mb-3">
                <label class="form-label fw-bold">E-mail</label>
                <input type="email" class="form-control form-control-lg border-primary" placeholder="seu@email.com">
            </div>
            <div class="mb-4">
                <label class="form-label fw-bold">Senha</label>
                <input type="password" class="form-control form-control-lg border-primary" placeholder="••••••••">
            </div>
            
<a href="index.html" class="btn btn-primary btn-lg w-100 fw-bold mb-3">Entrar</a>
            
            <div class="text-center">
                <a href="#" class="text-decoration-none text-muted">Esqueci minha senha</a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
